[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-quant-trading-lab"
version = "0.1.0"
description = "Offline quantitative research examples, backtesting semantics and safety references"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "privEgem"}]
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "pandas-market-calendars>=5,<6", "tzdata>=2025"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["trading_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
