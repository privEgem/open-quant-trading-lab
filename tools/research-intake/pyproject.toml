[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-intake"
version = "0.1.0"
description = "Quarantined, deterministic arXiv quantitative-research intake"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "privEgem"}]
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.package-data]
research_intake = ["resources/config/*.yaml", "resources/schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP017"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["research_intake"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
